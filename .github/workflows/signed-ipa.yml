name: Signed IPA (personal Apple ID)

# Runs on demand only. The signing material lives in repository secrets and is
# never exposed to the agent, to the logs, or to anyone else.
#
# Required secrets:
#   P12_BASE64        base64 of the .p12 export of your personal signing certificate
#   P12_PASSWORD      password of that .p12
#   PROFILE_BASE64    base64 of the .mobileprovision profile
#   PROFILE_NAME      profile name, e.g. "iOS Developer: Your Name (TEAMID)"
#   TEAM_ID           Apple team identifier
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        default: Release
        type: choice
        options: [Release, Debug]

jobs:
  sign:
    name: Build and sign IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import certificate and profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          set -euo pipefail
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain > /dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_NAME.mobileprovision"
          rm -f certificate.p12

      - name: Build
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project GlobalIAPRadar.xcodeproj -scheme GlobalIAPRadar \
            -sdk iphoneos -configuration "${{ inputs.configuration }}" -derivedDataPath build \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            build | tee build.log

      - name: Package signed IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/${{ inputs.configuration }}-iphoneos/GlobalIAPRadar.app Payload/
          (cd Payload && zip -qr ../GlobalIAPRadar-signed.ipa .)
          shasum -a 256 GlobalIAPRadar-signed.ipa
          du -h GlobalIAPRadar-signed.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlobalIAPRadar-signed-ipa
          path: GlobalIAPRadar-signed.ipa

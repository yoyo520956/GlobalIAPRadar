name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-engine:
    name: Data engine smoke test (real Apple APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe ChatGPT across all 175 storefronts
        run: python3 scripts/probe_apps.py "ChatGPT=6448311069"
      - name: Upload probe snapshot
        uses: actions/upload-artifact@v4
        with:
          name: probe-snapshot
          path: data/probe_*.json

  ios:
    name: Build unsigned IPA + unit tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version

      - name: Build release (unsigned)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild -project GlobalIAPRadar.xcodeproj -scheme GlobalIAPRadar \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/build.log

      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin).get('devices', {})
          fallback = None
          for runtime, devices in data.items():
              for dev in devices:
                  if not dev.get('isAvailable'):
                      continue
                  name = dev.get('name', '')
                  if fallback is None and name.startswith('iPhone'):
                      fallback = dev['udid']
                  if name == 'iPhone SE (3rd generation)':
                      fallback = dev['udid']
                      break
              if fallback and fallback == dev.get('udid') and dev.get('name') == 'iPhone SE (3rd generation)':
                  break
          print(fallback or '')
          ")
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"
          xcrun simctl list devices available | head -40

      - name: Run unit tests
        run: |
          set -eo pipefail
          xcodebuild -project GlobalIAPRadar.xcodeproj -scheme GlobalIAPRadar \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO test | tee build/test.log

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GlobalIAPRadar.app Payload/
          zip -qr GlobalIAPRadar-unsigned.ipa Payload
          shasum -a 256 GlobalIAPRadar-unsigned.ipa
          ls -lh GlobalIAPRadar-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GlobalIAPRadar-unsigned-ipa
          path: GlobalIAPRadar-unsigned.ipa

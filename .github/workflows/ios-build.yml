name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-engine:
    name: Data engine smoke test (real Apple APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe ChatGPT across all 175 storefronts
        run: python3 scripts/probe_apps.py "ChatGPT=6448311069"

      # A missing or duplicated localisation key does not fail the Swift build;
      # it just renders raw or blank text on device. Enforce it here, where
      # Python already runs, so a table drift fails the pipeline instead of
      # shipping a silently broken label.
      - name: Audit localisation table against call sites
        run: python3 scripts/check_l10n.py
      - name: Upload probe snapshot
        uses: actions/upload-artifact@v4
        with:
          name: probe-snapshot
          path: data/probe_*.json

  ios:
    name: Build unsigned IPA + unit tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The macOS runners ship several Xcode versions and several simulator
      # runtimes. A device chosen from `simctl` alone can belong to a runtime
      # the selected Xcode cannot host, which makes xcodebuild reject the
      # destination. This step asks Xcode directly which destinations are
      # eligible and exports a verified (Xcode, simulator) pair.
      - name: Select Xcode and simulator
        id: toolchain
        run: |
          set -eo pipefail
          mkdir -p build
          python3 scripts/select_simulator.py | tee build/toolchain.json
          echo "DEVELOPER_DIR=${{ steps.toolchain.outputs.xcode_path }}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
          echo "Xcode selected: ${{ steps.toolchain.outputs.xcode_path }}"
          echo "Simulator: ${{ steps.toolchain.outputs.sim_name }} (iOS ${{ steps.toolchain.outputs.simulator_sdk }})"
          echo "Simulator runtime: ${{ steps.toolchain.outputs.sim_runtime }}"

      # The signing workflow builds for a real device (iphoneos SDK) instead of
      # a simulator, and that is a different selection problem: newest Xcode
      # whose iphoneos SDK answers xcodebuild, not the lowest one with a runtime.
      # It runs here so the device selection is proven on a real macOS runner
      # before anyone supplies signing secrets.
      - name: Validate device toolchain selection
        run: |
          set -eo pipefail
          python3 scripts/select_simulator.py --mode device | tee build/device-toolchain.json
          # NOTE: deliberately does NOT touch DEVELOPER_DIR. The build below stays
          # on the simulator-verified toolchain; this step only proves that the
          # device-mode selection the signing workflow relies on works.
          . build/xcode-env.sh
          echo "device Xcode that signed-ipa.yml would use: $XCODE_VERSION at $XCODE_PATH (iphoneos SDK $IPHONEOS_SDK)"

      - name: Build release (unsigned)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild -project GlobalIAPRadar.xcodeproj -scheme GlobalIAPRadar \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/build.log

      - name: Run unit tests
        run: |
          set -eo pipefail
          xcodebuild -project GlobalIAPRadar.xcodeproj -scheme GlobalIAPRadar \
            -destination "platform=iOS Simulator,id=${{ steps.toolchain.outputs.sim_udid }}" \
            CODE_SIGNING_ALLOWED=NO test | tee build/test.log

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GlobalIAPRadar.app Payload/
          zip -qr GlobalIAPRadar-unsigned.ipa Payload
          shasum -a 256 GlobalIAPRadar-unsigned.ipa
          ls -lh GlobalIAPRadar-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GlobalIAPRadar-unsigned-ipa
          path: GlobalIAPRadar-unsigned.ipa

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
